defaults:
  - _self_

data:
  # CSV for path and metadata to training examples.
  csv_path_train: 
  data_path_train:
  csv_path_val:
  data_path_val: 
  data_format: csv
  max_len:
  task:
  size:
  sample_mode: normal
  sample_num: 
  tokenizer_path: ./data/tokenizer.json

model:
  use_peft: true
  peft_rank: 16
  peft_alpha: ${model.peft_rank}
  



experiment:
  # Experiment metadata
  name:
  run_id: null
  num_parameters: null

  # Hardware
  use_ddp : True
  use_gpu: True
  num_loader_workers: 1
  prefetch_factor: 10
  use_amp: True

  # Training arguments
  loss_type: dpo
  beta: 0.1
  tau: 1.0
  batch_size: 16
  accumulation_steps: 1
  num_epoch: 5
  num_steps:
  validate: True

  # Scheduler
  learning_rate: 0.0001
  weight_decay:
  schedule_type: cosin_decay
  warmup_steps: 1000
  cooldown_steps:
  gamma:
  min_lr_scale:
  period: 200000
  max_gradient_norm: 1.0

  # Logging
  log_freq: 1000
  ckpt_freq:
  
  # Checkpoint directory to warm start from.
  resume_from_ckpt:
  use_ckpt_conf: True
  warm_start:
  ckpt_dir: ./ckpt/
  freeze: False

hydra:
  run:
    dir: ./outputs/${experiment.name}/${now:%dD_%mM_%YY_%Hh_%Mm_%Ss}
